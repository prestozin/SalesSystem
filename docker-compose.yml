services:
  database:
    image: postgres:17
    container_name: sales-system-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: sales_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - sales_system_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales_system"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sales_system_data: